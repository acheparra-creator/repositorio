<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumbo a Alfa Centauri</title>
<style>
  :root {
    --bg: #060912; --bg2: #0f1630; --card: #141b2e; --ink: #e8edf2; --muted: #8b96ad;
    --accent: #a78bfa; --accent-ink: #0b1020; --line: #232c42; --good: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif; color: var(--ink);
    background:
      radial-gradient(ellipse 90% 55% at 50% -5%, rgba(124, 58, 237, .30), transparent 70%),
      radial-gradient(ellipse 70% 45% at 88% 78%, rgba(34, 211, 238, .16), transparent 70%),
      radial-gradient(ellipse 60% 40% at 8% 55%, rgba(236, 72, 153, .12), transparent 70%),
      #04060e;
    background-attachment: fixed;
  }
  /* campo de estrellas: tres capas de distinto tamaño para dar profundidad */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 24px 32px, #fff, transparent),
      radial-gradient(1.4px 1.4px at 143px 88px, rgba(255,255,255,.85), transparent),
      radial-gradient(1.7px 1.7px at 208px 21px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 61px 176px, rgba(199,210,254,.9), transparent),
      radial-gradient(1.5px 1.5px at 176px 148px, #fff, transparent),
      radial-gradient(1.1px 1.1px at 108px 118px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.3px 1.3px at 236px 196px, rgba(165,243,252,.9), transparent),
      radial-gradient(1px 1px at 12px 108px, rgba(255,255,255,.6), transparent);
    background-size: 260px 240px;
    background-repeat: repeat;
    opacity: .75;
    animation: parpadeo 7s ease-in-out infinite;
  }
  @keyframes parpadeo { 0%, 100% { opacity: .75; } 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 16px 12px 40px; }
  h1 { font-size: 1.3rem; margin: 8px 0 16px; text-align: center; }
  .card { background: rgba(20, 27, 46, .82); backdrop-filter: blur(2px); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .chars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .char { background: rgba(20, 27, 46, .82); border: 2px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; }
  .char.sel { border-color: var(--accent); background: rgba(46, 26, 92, .9); }
  /* medallón claro: sin él, el cabello oscuro se pierde contra el fondo espacial */
  .char .avatar {
    width: 78px; height: 78px; margin: 0 auto 8px; border-radius: 50%; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
    background: radial-gradient(circle at 50% 32%, #eef3fb, #a8b8d8 78%);
    box-shadow: inset 0 -6px 12px rgba(30, 41, 74, .25);
  }
  .char.sel .avatar { box-shadow: inset 0 -6px 12px rgba(30,41,74,.25), 0 0 0 2px var(--accent); }
  .char .avatar svg { width: 68px; height: 78px; display: block; }
  .char .lvl { color: var(--muted); font-size: .8rem; }
  button { font-size: 1rem; border: none; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-ink); width: 100%; margin-top: 14px; }
  .primary:disabled { opacity: .4; cursor: not-allowed; }
  .board { display: flex; overflow-x: auto; gap: 8px; padding: 10px 4px; background: linear-gradient(180deg, rgba(15,22,48,.85), rgba(6,9,18,.85)); border: 1px solid var(--line); border-radius: 12px; }
  .cell { flex: 0 0 auto; width: 78px; text-align: center; }
  .cell .planet { font-size: 1.6rem; background: rgba(20,27,46,.9); border: 1px solid var(--line); border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
  .cell .name { font-size: .68rem; color: var(--muted); margin-top: 4px; }
  .cell .tokens { display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; min-height: 26px; margin-top: 5px; }
  /* misma idea que el medallón: fondo claro para que el pelo oscuro se distinga */
  .ficha {
    width: 24px; height: 24px; border-radius: 50%; overflow: hidden; flex: 0 0 auto;
    display: flex; align-items: flex-end; justify-content: center;
    background: radial-gradient(circle at 50% 32%, #eef3fb, #a8b8d8 78%);
  }
  .ficha svg { width: 21px; height: 24px; display: block; }
  .turn { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; margin: 12px 0; }
  .turn .ficha { width: 30px; height: 30px; }
  .turn .ficha svg { width: 26px; height: 30px; }
  .stats .ficha { width: 22px; height: 22px; display: inline-flex; vertical-align: middle; margin-right: 6px; }
  .stats .ficha svg { width: 19px; height: 22px; }
  .qcat { color: var(--muted); font-size: .8rem; text-transform: uppercase; }
  .qtext { font-size: 1.1rem; margin: 8px 0 14px; }
  .opt { display: block; width: 100%; text-align: left; background: var(--bg2); border: 1px solid var(--line); color: var(--ink); margin-bottom: 8px; }
  .opt.correct { background: var(--good); color: #06280f; border-color: var(--good); }
  .opt.wrong { background: var(--bad); color: #3a0a0a; border-color: var(--bad); }
  .explain { background: var(--bg2); border-radius: 10px; padding: 10px; margin-top: 10px; font-size: .92rem; }
  .stats { width: 100%; border-collapse: collapse; }
  .stats td, .stats th { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
const CATEGORY_LABELS = {
  espacio: 'Espacio y astronomía',
  fisica: 'Física y naturaleza',
  biologia: 'Cuerpo humano y biología',
  quimica: 'Química y materia',
};
const ui = { screen: 'select', selected: [] };
let game = null;

// Avatares diseñados para cada personaje de la familia (no fotos/rostros
// reales, estilo caricatura): hija güera de rizos, hijo con moicana,
// mamá alta de pelo lacio, papá con barba y coleta.
const AVATARS = {
  hija: `<svg viewBox="0 0 100 120"><rect x="30" y="66" width="40" height="54" rx="14" fill="#ec4899"/><path d="M22,40 Q50,12 78,40 L79,94 Q69,100 63,90 L63,52 L37,52 L37,90 Q31,100 21,94Z" fill="#f0cb52"/><circle cx="50" cy="46" r="24" fill="#f9e0c6"/><circle cx="29" cy="32" r="10" fill="#f0cb52"/><circle cx="41" cy="23" r="11" fill="#f0cb52"/><circle cx="59" cy="23" r="11" fill="#f0cb52"/><circle cx="71" cy="32" r="10" fill="#f0cb52"/><circle cx="25" cy="47" r="8" fill="#f0cb52"/><circle cx="75" cy="47" r="8" fill="#f0cb52"/><circle cx="42" cy="47" r="2.7" fill="#22303f"/><circle cx="58" cy="47" r="2.7" fill="#22303f"/><path d="M43,57 Q50,62 57,57" stroke="#22303f" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`,
  hijo: `<svg viewBox="0 0 100 120"><rect x="32" y="68" width="36" height="52" rx="12" fill="#f97316"/><circle cx="50" cy="47" r="22" fill="#f9e0c6"/><path d="M27,54 Q26,26 50,26 Q74,26 73,54 Q70,40 62,36 Q56,33 50,33 Q44,33 38,36 Q30,40 27,54Z" fill="#1b1a20"/><path d="M28,46 Q27,58 31,65 L36,62 Q32,54 33,46Z" fill="#1b1a20"/><path d="M72,46 Q73,58 69,65 L64,62 Q68,54 67,46Z" fill="#1b1a20"/><path d="M50,9 L44,24 L48,22 L47,29 L50,24 L53,29 L52,22 L56,24Z" fill="#1b1a20"/><rect x="44" y="20" width="12" height="12" rx="4" fill="#1b1a20"/><circle cx="43" cy="48" r="2.5" fill="#22303f"/><circle cx="57" cy="48" r="2.5" fill="#22303f"/><path d="M44,58 Q50,63 56,58" stroke="#22303f" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`,
  mama: `<svg viewBox="0 0 100 120"><rect x="30" y="70" width="40" height="50" rx="13" fill="#242c3d"/><path d="M19,44 Q50,10 81,44 Q83,86 75,100 L75,54 Q50,40 25,54 L25,100 Q17,86 19,44Z" fill="#221a17"/><circle cx="50" cy="49" r="23" fill="#f6d9b8"/><path d="M26,54 Q26,26 50,26 Q74,26 74,54 Q71,38 61,34 L50,32 L39,34 Q29,38 26,54Z" fill="#221a17"/><circle cx="42" cy="51" r="2.6" fill="#22303f"/><circle cx="58" cy="51" r="2.6" fill="#22303f"/><path d="M43,61 Q50,66 57,61" stroke="#22303f" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`,
  papa: `<svg viewBox="0 0 100 120"><rect x="28" y="64" width="44" height="56" rx="15" fill="#d9cca9"/><path d="M69,40 Q93,50 86,82 Q75,71 66,54Z" fill="#1d1618"/><circle cx="50" cy="44" r="25" fill="#ecc294"/><path d="M25,50 Q24,18 50,18 Q76,18 75,50 Q72,34 62,30 L38,30 Q28,34 25,50Z" fill="#1d1618"/><path d="M26,44 Q26,74 39,87 Q45,93 50,93 Q55,93 61,87 Q74,74 74,44 Q71,65 61,70 Q56,73 50,73 Q44,73 39,70 Q29,65 26,44Z" fill="#1d1618"/><path d="M40,57 Q50,53 60,57 Q50,61 40,57Z" fill="#1d1618"/><circle cx="42" cy="43" r="2.7" fill="#22303f"/><circle cx="58" cy="43" r="2.7" fill="#22303f"/><path d="M44,65 Q50,68 56,65" stroke="#22303f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderSelect() {
  const cards = RumboEngine.CHARACTERS.map((c) => {
    const sel = ui.selected.includes(c.id) ? ' sel' : '';
    return `<div class="char${sel}" onclick="selectCharacter('${c.id}')">
      <div class="avatar">${AVATARS[c.id]}</div>
      <div>${esc(c.name)}</div>
      <div class="lvl">Nivel: ${esc(c.level)}</div>
    </div>`;
  }).join('');
  const canStart = ui.selected.length >= 2 && ui.selected.length <= 4;
  return `<h1>🚀 Rumbo a Alfa Centauri</h1>
    <div class="card">
      <p>Toca a los jugadores que van a participar (2 a 4).</p>
      <div class="chars">${cards}</div>
      <button class="primary" ${canStart ? '' : 'disabled'} onclick="startGame()">Empezar partida</button>
    </div>`;
}
function selectCharacter(id) {
  const i = ui.selected.indexOf(id);
  if (i >= 0) ui.selected.splice(i, 1);
  else if (ui.selected.length < 4) ui.selected.push(id);
  render();
}
function startGame() {
  game = RumboEngine.createGame(ui.selected, QUESTIONS);
  RumboEngine.drawQuestion(game);
  ui.screen = 'play';
  render();
}

function renderPlay() {
  const cells = RumboEngine.BOARD.map((cell, i) => {
    const tokens = game.players
      .filter((p) => p.position === i)
      .map((p) => `<span class="ficha">${AVATARS[p.id]}</span>`)
      .join('');
    return `<div class="cell">
      <div class="planet">${cell.emoji}</div>
      <div class="name">${esc(cell.name)}</div>
      <div class="tokens">${tokens}</div>
    </div>`;
  }).join('');
  const player = RumboEngine.currentPlayer(game);
  const q = game.pendingQuestion;
  const result = game.pendingResult;
  let optsHtml = '';
  q.options.forEach((opt, i) => {
    let cls = 'opt';
    if (result) {
      if (i === q.correctIndex) cls += ' correct';
      else if (i === result.optionIndex) cls += ' wrong';
    }
    const attr = result ? '' : `onclick="answer(${i})"`;
    optsHtml += `<button class="${cls}" ${attr}>${esc(opt)}</button>`;
  });
  let footer = '';
  if (result) {
    footer = `<div class="explain">${result.correct ? '✅ ¡Correcto! ' : '❌ No era esa. '}${esc(q.explanation)}</div>
      <button class="primary" onclick="continueTurn()">Continuar</button>`;
  }
  return `<div class="board">${cells}</div>
    <div class="turn"><span class="ficha">${AVATARS[player.id]}</span> Turno de ${esc(player.name)}</div>
    <div class="card">
      <div class="qcat">${esc(CATEGORY_LABELS[q.category])}</div>
      <div class="qtext">${esc(q.question)}</div>
      ${optsHtml}
      ${footer}
    </div>`;
}
function answer(i) {
  RumboEngine.submitAnswer(game, i);
  render();
}
function continueTurn() {
  RumboEngine.advanceTurn(game);
  if (game.winnerId) { ui.screen = 'victory'; }
  else { RumboEngine.drawQuestion(game); }
  render();
}
function renderVictory() {
  const winner = game.players.find((p) => p.id === game.winnerId);
  const rows = game.players.map((p) =>
    `<tr><td><span class="ficha">${AVATARS[p.id]}</span>${esc(p.name)}</td><td>${p.correct}</td><td>${p.wrong}</td></tr>`
  ).join('');
  return `<h1>🏆 ¡${esc(winner.name)} llegó a Alfa Centauri!</h1>
    <div class="card">
      <table class="stats"><thead><tr><th>Jugador</th><th>Aciertos</th><th>Fallos</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <button class="primary" onclick="playAgain()">Jugar de nuevo</button>
    </div>`;
}
function playAgain() {
  game = null;
  ui.screen = 'select';
  ui.selected = [];
  render();
}
function render() {
  const app = document.getElementById('app');
  if (ui.screen === 'select') app.innerHTML = renderSelect();
  else if (ui.screen === 'play') app.innerHTML = renderPlay();
  else app.innerHTML = renderVictory();
}
render();
</script>
</body>
</html>
